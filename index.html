<title>Qué Comemos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Caveat:wght@600&display=swap">
<style>
/* Layout: app de cocina en pareja. Pestañas arriba; Hoy = comidas | plato + agua + mensajitos; Semana = planner 7 días × comidas; Juego = liga, retos y logros. */
:root{
  --bg:#F3F6F0; --surface:#FFFFFF; --surface-2:#E8EDE3; --ink:#1C2820; --ink-2:#56635A; --line:#D3DBCD;
  --accent:#2E6A3E; --accent-ink:#FFFFFF; --accent-soft:#DCEBDD; --warm:#C8741F; --warm-soft:#F6E6D2;
  --postit:#FFF2A8; --postit-ink:#3B3413;
  --ok:#2F7D4A; --mid:#B67A12; --low:#B2463A;
  --g-verdura:#3C8A4C; --g-fruta:#C44C69; --g-legumbre:#9E6A22; --g-integral:#A88A33; --g-lacteo:#4677AE;
  --g-proteina:#85563F; --g-pescado:#23858A; --g-semillas:#6F6A2C; --g-opc:#B0473A; --g-afuera:#6D6A86;
  --c-tomate:#C9483A; --c-violeta:#7452C2; --c-azul:#2F6DC4; --c-rosa:#C0407E; --c-naranja:#C06A12; --c-turquesa:#1F8589;
  --rb-rojo:#D2383A; --rb-naranja:#E07B1F; --rb-amarillo:#E3B91C; --rb-verde:#3E9A48; --rb-violeta:#7B3F9E; --rb-blanco:#E9E4D6;
  --pa:var(--c-tomate); --pb:var(--c-violeta);
  --f-display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-hand:"Caveat", "Segoe Print", "Bradley Hand", cursive;
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111713; --surface:#18201B; --surface-2:#222C25; --ink:#E4EBE3; --ink-2:#9BA99E; --line:#2E3A31;
  --accent:#7CC08C; --accent-ink:#0D1A11; --accent-soft:#223A28; --warm:#E6A05A; --warm-soft:#3A2B1C;
  --postit:#4A4219; --postit-ink:#FBF1C0;
  --ok:#6CC58A; --mid:#E0B055; --low:#E97B6C;
  --g-verdura:#6CC07B; --g-fruta:#EB7F99; --g-legumbre:#D29A4E; --g-integral:#D4B866; --g-lacteo:#7EA9DC;
  --g-proteina:#C38C72; --g-pescado:#5DC0C4; --g-semillas:#B7B060; --g-opc:#EA7E70; --g-afuera:#A8A5C8;
  --c-tomate:#EE7F70; --c-violeta:#A98EF0; --c-azul:#7AA9F0; --c-rosa:#EC82B6; --c-naranja:#EDA35C; --c-turquesa:#5EC6C9;
  --rb-rojo:#F06B6B; --rb-naranja:#F3A052; --rb-amarillo:#F0D35A; --rb-verde:#72C77B; --rb-violeta:#B27FD6; --rb-blanco:#D9D3C2;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#111713; --surface:#18201B; --surface-2:#222C25; --ink:#E4EBE3; --ink-2:#9BA99E; --line:#2E3A31;
  --accent:#7CC08C; --accent-ink:#0D1A11; --accent-soft:#223A28; --warm:#E6A05A; --warm-soft:#3A2B1C;
  --postit:#4A4219; --postit-ink:#FBF1C0;
  --ok:#6CC58A; --mid:#E0B055; --low:#E97B6C;
  --g-verdura:#6CC07B; --g-fruta:#EB7F99; --g-legumbre:#D29A4E; --g-integral:#D4B866; --g-lacteo:#7EA9DC;
  --g-proteina:#C38C72; --g-pescado:#5DC0C4; --g-semillas:#B7B060; --g-opc:#EA7E70; --g-afuera:#A8A5C8;
  --c-tomate:#EE7F70; --c-violeta:#A98EF0; --c-azul:#7AA9F0; --c-rosa:#EC82B6; --c-naranja:#EDA35C; --c-turquesa:#5EC6C9;
  --rb-rojo:#F06B6B; --rb-naranja:#F3A052; --rb-amarillo:#F0D35A; --rb-verde:#72C77B; --rb-violeta:#B27FD6; --rb-blanco:#D9D3C2;
  color-scheme:dark; }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 56px}
.wrap{max-width:1100px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--ink-2)} .small{font-size:13px} .tnum{font-variant-numeric:tabular-nums}
.hand{font-family:var(--f-hand);font-weight:600}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px 8px;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:10px;justify-content:space-between;max-width:1100px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand h1{font-size:24px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.brand h1 span{color:var(--accent)}
.couple{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:700;min-width:0;white-space:nowrap;overflow:hidden}
.couple b{color:var(--pa)} .couple i{color:var(--pb);font-style:normal}
.heart{color:var(--c-rosa);display:inline-block}
@media (prefers-reduced-motion:no-preference){.heart{animation:beat 1.6s ease-in-out infinite}@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.25)}24%{transform:scale(1)}}}
.sync{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:0 0 8px}
.sync.local{background:var(--mid)}
@media (max-width:460px){.couple{display:none}}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.tabs{display:flex;gap:4px;max-width:1100px;margin:10px auto 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:999px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
main{padding-top:16px}

.banner{background:var(--warm-soft);border:1px solid color-mix(in srgb,var(--warm) 35%,transparent);border-radius:var(--r);padding:12px 14px;margin-bottom:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner p{margin:0;flex:1 1 240px;min-width:0}
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.hello h2{font-size:30px;font-weight:800;letter-spacing:-.02em}
.hello .eyebrow{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--accent)}
.fact{font-size:13px;color:var(--ink-2);max-width:60ch}
.fact b{color:var(--ink)}

/* week strip */
.week{display:flex;align-items:stretch;gap:6px;margin-bottom:16px}
.week .nav{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);width:36px;flex:0 0 36px;font-size:18px}
.days7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;flex:1;min-width:0}
.d7{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.d7 .wd{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.d7 .dn{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1}
.d7 .pip{height:6px;width:18px;border-radius:3px;background:var(--surface-2)}
.d7.today .wd{color:var(--accent);font-weight:700}
.d7[aria-current="date"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.d7[aria-current="date"] .wd{color:inherit;opacity:.8}
.pip.ok{background:var(--ok)} .pip.mid{background:var(--mid)} .pip.low{background:var(--low)} .pip.plan{background:transparent;border:1.5px dashed var(--ink-2)}

.daygrid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}
@media (max-width:860px){.daygrid{grid-template-columns:minmax(0,1fr)}}
.meal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.meal-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.meal-h h3{font-size:16px;font-weight:700}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;padding:4px 2px;text-align:left}
.entries{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.entry{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px;background:var(--surface-2);border-left:4px solid var(--who,var(--line))}
.entry.planned{background:transparent;border:1.5px dashed var(--line);border-left:4px solid var(--who,var(--line))}
.entry .txt{flex:1;min-width:0;overflow-wrap:anywhere;text-align:left;border:0;background:none;padding:0}
.entry .meta{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:3px;align-items:center}
.who{font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;color:#fff;background:var(--who,var(--ink-2));white-space:nowrap}
:root[data-theme="dark"] .who{color:#111}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .who{color:#111}}
.cook{font-size:11.5px;color:var(--ink-2);font-weight:600}
.x{border:0;background:none;color:var(--ink-2);font-size:18px;line-height:1;padding:2px 4px}
.gt{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--ink-2)}
.gt::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,var(--ink-2))}
.rx{display:flex;gap:4px;align-items:center;margin-top:5px;flex-wrap:wrap}
.rxb{border:1px solid var(--line);background:var(--surface);border-radius:999px;font-size:13px;line-height:1;padding:3px 7px}
.rxb[aria-pressed="true"]{border-color:var(--pme,var(--accent));background:color-mix(in srgb,var(--pme,var(--accent)) 14%,var(--surface))}
.rxo{font-size:12px;border-radius:999px;padding:2px 8px;background:color-mix(in srgb,var(--who) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--who) 50%,transparent)}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .35s ease-out}@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}}

.addbtn{margin-top:8px;width:100%;border:1.5px dashed var(--line);background:transparent;border-radius:10px;padding:8px;color:var(--ink-2);font-weight:600;text-align:left}
.addbtn:hover{border-color:var(--accent);color:var(--accent)}
.form{margin-top:10px;display:flex;flex-direction:column;gap:10px}
.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 11px}
.inp:focus{border-color:var(--accent);outline:none}
textarea.inp{resize:vertical;min-height:64px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--bg);flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px 4px 8px;font-size:12.5px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 16%,var(--surface));border-color:var(--c);color:var(--ink)}
.chip.plain::before{display:none} .chip.plain{padding-left:10px}
.btn{border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:10px;padding:9px 16px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.warm{background:var(--warm);color:#fff}
.btn.fun{background:var(--c-rosa);color:#fff}
:root[data-theme="dark"] .btn.warm,:root[data-theme="dark"] .btn.fun{color:#111}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.warm,:root:not([data-theme="light"]) .btn.fun{color:#111}}
.btn:disabled{opacity:.5;cursor:default}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2);font-weight:700}
.lbl-inline{text-transform:none;letter-spacing:0;font-weight:400}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.side{display:flex;flex-direction:column;gap:10px}
.plato{display:flex;gap:14px;align-items:center}
.plato svg{flex:0 0 128px;width:128px;height:128px}
.plato ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:12.5px;min-width:0}
.plato li{display:flex;gap:6px;align-items:flex-start}
.plato li b{font-weight:600}
.plato li .ck{width:14px;flex:0 0 14px;text-align:center;font-weight:800}
.score{display:flex;align-items:baseline;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.score .n{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1}
.water{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.wrow{display:flex;align-items:center;gap:8px}
.wrow .nm{width:70px;font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--who)}
.glasses{display:flex;gap:3px;flex:1}
.glasses i{flex:1;height:18px;border-radius:3px 3px 5px 5px;background:var(--surface-2)}
.glasses i.on{background:var(--g-lacteo)}
.step{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-weight:700}
.moods{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.moods .mrow{display:flex;align-items:center;gap:6px}
.moods .mrow .nm{width:70px;font-weight:700;font-size:13px;color:var(--who);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mood{border:1px solid transparent;background:none;border-radius:8px;font-size:20px;padding:1px 4px;line-height:1.2;filter:grayscale(1);opacity:.45}
.mood[aria-pressed="true"]{filter:none;opacity:1;border-color:var(--line);background:var(--surface-2)}
.postits{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.postit{background:var(--postit);color:var(--postit-ink);border-radius:4px;padding:8px 10px 10px;box-shadow:0 2px 6px rgba(0,0,0,.08);transform:rotate(-1.2deg);display:flex;flex-direction:column;gap:2px;min-width:0}
.postit:nth-child(2){transform:rotate(1.1deg)}
.postit .to{font-size:11px;font-weight:700;opacity:.75}
.postit textarea{font-family:var(--f-hand);font-size:20px;line-height:1.1;background:transparent;border:0;resize:none;color:inherit;min-height:66px;width:100%;padding:0}
.postit textarea:focus{outline:none}
.postit textarea::placeholder{color:inherit;opacity:.45}
.note-in{margin-top:8px}

/* planner */
.board-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.board{border-collapse:separate;border-spacing:0;min-width:900px;width:100%;table-layout:fixed}
.board th,.board td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:top;padding:6px}
.board thead th{background:var(--surface);position:sticky;top:0;text-align:left;padding:8px 6px}
.board th.mh{width:96px;position:sticky;left:0;background:var(--surface);z-index:1;font-family:var(--f-display);font-size:13px;text-align:left}
.board thead th.today{background:var(--accent-soft)}
.board td.today{background:color-mix(in srgb,var(--accent-soft) 45%,var(--surface))}
.board .dh{display:flex;justify-content:space-between;align-items:center;gap:4px}
.board .dh b{font-family:var(--f-display);font-size:15px}
.pl{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--who,var(--line));background:var(--surface-2);border-radius:6px;padding:4px 6px;font-size:12.5px;line-height:1.25;margin-bottom:4px;overflow-wrap:anywhere}
.pl.fut{background:transparent;outline:1px dashed var(--line)}
.plus{width:100%;border:1px dashed var(--line);background:transparent;border-radius:6px;color:var(--ink-2);font-weight:700;padding:2px 0;opacity:.7}
.plus:hover{opacity:1;color:var(--accent);border-color:var(--accent)}

/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.calhead h2{font-size:26px;font-weight:800}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.calgrid .wdh{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);text-align:center}
.cell{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-height:74px;padding:6px;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0}
.cell.out{opacity:.35}
.cell.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cell .num{font-weight:700;font-size:13px}
.badge{font-size:12px;font-weight:800;border-radius:6px;padding:1px 6px;align-self:flex-start;color:#fff}
.badge.ok{background:var(--ok)} .badge.mid{background:var(--mid)} .badge.low{background:var(--low)}
.badge.plan{background:transparent;color:var(--warm);border:1.5px dashed var(--warm)}
:root[data-theme="dark"] .badge:not(.plan){color:#0D1A11}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .badge:not(.plan){color:#0D1A11}}
.cell .cnt{font-size:11px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:520px){.cell{min-height:56px;padding:4px}.cell .cnt{display:none}}

/* ideas */
.filters{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.gaps{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.gap{border-radius:10px;padding:8px 12px;background:var(--surface);border:1px solid var(--line);font-size:13px}
.gap b{font-family:var(--f-display);font-size:16px}
.gap.short{border-color:var(--warm);background:var(--warm-soft)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;position:relative}
.rcard h3{font-size:17px;font-weight:700;padding-right:28px}
.rcard .why{font-size:13px;color:var(--accent);font-weight:600}
.rcard .foot{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap}
.fav{position:absolute;top:10px;right:10px;border:0;background:none;font-size:20px;line-height:1;color:var(--line);padding:2px}
.fav[aria-pressed="true"]{color:var(--c-rosa)}
.min{font-size:12px;color:var(--ink-2);font-weight:600}
.section-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:22px 0 10px;flex-wrap:wrap}
.section-h h2{font-size:21px;font-weight:800}
.plan-prev{list-style:none;padding:0;margin:10px 0;display:flex;flex-direction:column;gap:4px}
.plan-prev li{display:flex;gap:10px;font-size:14px;flex-wrap:wrap}
.plan-prev li span:first-child{width:140px;flex:0 0 140px;color:var(--ink-2)}
.ai{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;margin-top:10px}
.herorow{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-bottom:18px}
.bigcta{border:0;border-radius:var(--r);padding:16px;text-align:left;display:flex;flex-direction:column;gap:4px;color:var(--ink)}
.bigcta b{font-family:var(--f-display);font-size:19px}
.bigcta span{font-size:13px;color:var(--ink-2)}
.bigcta.ruleta{background:color-mix(in srgb,var(--c-rosa) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--c-rosa) 40%,transparent)}
.bigcta.semana{background:var(--warm-soft);border:1px solid color-mix(in srgb,var(--warm) 40%,transparent)}
.bigcta.antojo{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}

/* ruleta */

const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };

const queues={};
function enqueue(path,fn){ const p=(queues[path]||Promise.resolve()).then(fn).catch(onWriteErr); queues[path]=p; return p; }
function onWriteErr(e){
  const code=e&&e.code;
  if(code==='invalid_argument') toast('No se pudo guardar: esta cuenta no tiene permiso para anotar. Pedí acceso de Editor.');
  else if(code==='quota_exceeded') toast('Se llenó el espacio de datos. Borren recetas o listas viejas.');
  else toast('No se pudo guardar. Revisá la conexión y probá de nuevo.');
}
function patchDoc(path, patch){
  S.docs[path] = deepMerge(clone(S.docs[path]), clone(patch));
  render();
  if(!db){ saveLocal(); return Promise.resolve(); }
  return enqueue(path, async()=>{
    const ref=db.doc(path);
    if(S.known.has(path)){ try{ await ref.update(patch); return; }catch(e){ if(e.code!=='invalid_argument') throw e; } }
    const snap=await ref.get();
    if(snap.exists) await ref.update(patch); else await ref.set(patch);
    S.known.add(path);
  });
}
function setDoc(path, data){
  S.docs[path]=clone(data); render();
  if(!db){ saveLocal(); return Promise.resolve(); }
  return enqueue(path, async()=>{ await db.doc(path).set(data); S.known.add(path); });
}
function removeDoc(path){
  delete S.docs[path]; render();
  if(!db){ saveLocal(); return Promise.resolve(); }
  return enqueue(path, ()=>db.doc(path).delete());
}
function listen(col){
  db.collection(col).onSnapshot(snap=>{
    for(const k of Object.keys(S.docs)) if(k.startsWith(col+'/')){ delete S.docs[k]; S.known.delete(k); }
    for(const d of snap.docs){ S.docs[col+'/'+d.id]=d.data(); S.known.add(col+'/'+d.id); }

  }, ()=>setSync('Sin conexión en vivo', true));
}

const forWho = (e,p) => p==='ambos' ? true : (e.who===p || e.who==='ambos' || !e.who);
function dayStats(date, p){
  const es = entriesOf(date).filter(e=>forWho(e,p));
  const cnt = {}; TAGS.forEach(t=>cnt[t.id]=0);
  es.forEach(e=>(e.tags||[]).forEach(t=>{ if(cnt[t]!==undefined) cnt[t]++; }));
  const w = dayDoc(date).water||{};
  const water = p==='ambos' ? ((w.a||0)+(w.b||0))/2 : (w[p]||0);
  return {n:es.length, cnt, fv:cnt.verdura+cnt.fruta, water};
}
function scoreOf(st, diet){
  if(!st.n) return null;
  const c=st.cnt, veg=diet&&diet!=='omni'; let s=0;
  s += Math.min(st.fv,5)*0.8;
  if(c.proteina||c.pescado||c.legumbre||(veg&&c.lacteo)) s+=1;
  if(c.integral||c.legumbre) s+=1;
  if(c.lacteo) s+=0.5;
  if(c.semillas) s+=0.5;
  s += st.water>=8?1.5:st.water>=5?0.75:0;
  if(veg){ if(c.legumbre) s+=0.75; if(c.legumbre>=2||(c.legumbre&&c.semillas)) s+=0.75; }
  else { if(c.pescado) s+=0.75; if(c.legumbre) s+=0.75; }
  s -= Math.min(c.ultra,2) + Math.min(c.dulce,2)*0.75 + Math.min(c.gaseosa,2) + Math.min(c.alcohol,2)*0.75 + Math.min(c.afuera,2)*0.5;
  return Math.max(0,Math.min(10,Math.round(s*10)/10));
}
const personScore = (d,p) => scoreOf(dayStats(d,p), dietOf(p));
function dayScore(date){
  const sa=personScore(date,'a'), sb=personScore(date,'b');
  if(sa==null&&sb==null) return null; if(sa==null) return sb; if(sb==null) return sa;
  return Math.round((sa+sb)/2*10)/10;
}
const band = s => s==null?'':s>=7?'ok':s>=4.5?'mid':'low';
const bandLabel = s => s==null?'Sin datos':s>=8.5?'¡Nivel chef saludable!':s>=7?'Muy balanceado':s>=5.5?'Bien encaminado':s>=4?'Con margen para mejorar':s>=2.5?'Flojito':'Día de chanchada';

function rangeMetrics(from,to,p){
  const out={days:0,fv:0,water:0,cnt:{},dayHas:{},scores:[],texts:{},mood:{good:[],rest:[]},cook:{a:0,b:0,juntos:0}};
  TAGS.forEach(t=>{out.cnt[t.id]=0; out.dayHas[t.id]=0;});
  for(let d=from; d<=to; d=addDays(d,1)){
    const persons = p==='ambos'?['a','b']:[p];
    const sts = persons.map(q=>dayStats(d,q)).filter(s=>s.n);
    const sa=personScore(d,'a'), sb=personScore(d,'b');
    out.scores.push({d, s: p==='ambos'?dayScore(d):personScore(d,p), a:sa, b:sb});
    if(!sts.length) continue;
    out.days++;
    const k=sts.length;
    out.fv += sts.reduce((a,s)=>a+s.fv,0)/k;
    out.water += sts.reduce((a,s)=>a+s.water,0)/k;
    TAGS.forEach(t=>{ out.cnt[t.id]+=sts.reduce((a,s)=>a+s.cnt[t.id],0)/k; if(sts.some(s=>s.cnt[t.id])) out.dayHas[t.id]++; });
    const es=entriesOf(d).filter(e=>forWho(e,p));
    es.forEach(e=>{ const key=norm(e.text).trim(); if(key){ out.texts[key]=out.texts[key]||{t:e.text,n:0}; out.texts[key].n++; } if(out.cook[e.cook]!==undefined) out.cook[e.cook]++; });
    const md=dayDoc(d).mood||{}, sc=p==='ambos'?dayScore(d):personScore(d,p);
    persons.forEach(q=>{ if(md[q]) (sc!=null&&sc>=7?out.mood.good:out.mood.rest).push(md[q]); });
  }
  return out;
}
/* Pescado se mide en quien come carne; legumbres en quien es veggie (si hay), así cada uno tiene su meta */
function weekGaps(){
  const to=TODAY(), from=addDays(to,-6), m=rangeMetrics(from,to,'ambos');
  const omni=['a','b'].find(p=>!isVegP(p)), veg=['a','b'].find(isVegP);
  const fishP=omni||'ambos', legP=veg||'ambos';
  const mf=rangeMetrics(from,to,fishP), ml=rangeMetrics(from,to,legP);
  let planFish=0, planLeg=0;
  for(let d=addDays(to,1); d<=addDays(to,6); d=addDays(d,1)) entriesOf(d).forEach(e=>{ const tg=e.tags||[]; if(tg.includes('pescado')&&forWho(e,fishP)) planFish++; if(tg.includes('legumbre')&&forWho(e,legP)) planLeg++; });
  const G=goalsFor('ambos');
  return {pescado:mf.cnt.pescado, legumbre:ml.cnt.legumbre, planFish, planLeg, fv:m.days?m.fv/m.days:0, integral:m.dayHas.integral, days:m.days, water:m.days?m.water/m.days:0,
    gFish:G.pescado, gLeg:G.legumbre, fishWho: omni&&veg?names()[omni]:'', legWho: veg&&omni?names()[veg]:''};
}

function weekInfo(mon){
  const t=TODAY(), end=addDays(mon,6), last=end<t?end:t;
  const w={mon, end, over:end<t, logged:0, pescado:0, legumbre:0, shared:0, gaseosa:0, afuera:0, juntos:0, water8:0, colors:new Set(), newRecipe:0, pts:{a:0,b:0}, daysP:{a:0,b:0}};
  if(mon>t) return w;
  const before=new Set(); for(const d of days()) if(d<mon) entriesOf(d).forEach(e=>e.recipeId&&before.add(e.recipeId));
  for(let d=mon; d<=last; d=addDays(d,1)){
    const es=entriesOf(d); if(es.length) w.logged++;
    es.forEach(e=>{ const tg=e.tags||[];
      if(tg.includes('pescado')) w.pescado++; if(tg.includes('legumbre')&&(!['a','b'].some(isVegP)||['a','b'].some(p=>isVegP(p)&&forWho(e,p)))) w.legumbre++; if(tg.includes('gaseosa')) w.gaseosa++; if(tg.includes('afuera')) w.afuera++;
      if(e.cook==='juntos') w.juntos++;
      if(e.alt) w.shared++;
      if(e.recipeId&&!e.alt&&!before.has(e.recipeId)){ w.newRecipe++; before.add(e.recipeId); }
      entryColors(e).forEach(c=>w.colors.add(c));
    });
    const wt=dayDoc(d).water||{}; if((wt.a||0)>=8&&(wt.b||0)>=8) w.water8++;
    ['a','b'].forEach(p=>{ const s=personScore(d,p); if(s!=null){ w.pts[p]+=s; w.daysP[p]++; } });
  }
  w.pts.a=Math.round(w.pts.a*10)/10; w.pts.b=Math.round(w.pts.b*10)/10;
  return w;
}

function streaks(){
  const ds=new Set(days().filter(d=>entriesOf(d).length&&d<=TODAY()));
  let cur=0, d=TODAY(); if(!ds.has(d)) d=addDays(d,-1);
  while(ds.has(d)){ cur++; d=addDays(d,-1); }
  let best=0, run=0, prev=null;
  [...ds].sort().forEach(x=>{ run = prev && addDays(prev,1)===x ? run+1 : 1; best=Math.max(best,run); prev=x; });
  return {cur, best};
}
function achievements(){
  const all=days().filter(d=>d<=TODAY());
  let entries=0, fish=0, chefs=0, hydr=false, rainbow=false, perfectWeek=false, top=false, finde=false;
  const recs=new Set();
  all.forEach(d=>{ entriesOf(d).forEach(e=>{ entries++; if((e.tags||[]).includes('pescado')) fish++; if(e.cook==='juntos') chefs++; if(e.recipeId) recs.add(e.recipeId); });

/* ================= Sugerencias ================= */
function rng(seed){ let x=seed*9301+49297; return ()=>{ x=(x*9301+49297)%233280; return x/233280; }; }
function suggest(cat, time, fridge, seed, onlyFav, forP){
  const g=weekGaps(), target=forP||S.idea.forP||'ambos';
  const need = {pescado:Math.max(0,g.gFish-g.pescado-g.planFish), legumbre:Math.max(0,g.gLeg-g.legumbre-g.planLeg), verdura:g.fv<GOALS.fv?1:0, fruta:g.fv<GOALS.fv?1:0, integral:g.integral<4?1:0};
  if(target!=='ambos'){ if(isVegP(target)) need.pescado=0; }
  const recent=new Set();
  for(let d=addDays(TODAY(),-10); d<=addDays(TODAY(),7); d=addDays(d,1)) entriesOf(d).forEach(e=>e.recipeId&&recent.add(e.recipeId));
  const liked=new Set(); days().forEach(d=>entriesOf(d).forEach(e=>{ if(e.recipeId&&e.rx&&Object.values(e.rx).some(v=>v==='love'||v==='yum')) liked.add(e.recipeId); }));
  const fw = norm(fridge).split(/[,;\n]+|\s+y\s+/).map(s=>s.trim()).filter(s=>s.length>2);
  const season = SEASON[seasonNow()].map(norm);
  const fv=favs(), r=rng(seed);
  const mixed = target==='ambos' && ['a','b'].some(isVegP) && ['a','b'].some(p=>!isVegP(p));
  return allRecipes().filter(x=>x.m.includes(cat) && (!time || x.t<=time) && (!onlyFav || fv[x.id]) && fitFor(x,target)).map(x=>{
    let sc=r()*1.5, why=[];
    const fit=fitFor(x,target);
    if(mixed && fit==='ok' && x.m.includes('ac')){ sc+=0.8; }
    if(fit==='alt') why.push(`Con versión veggie para ${vegName()}: ${x.alt.n.toLowerCase()}`);
    const ing=norm((x.i||[]).join(' ')+' '+x.n);
    const hits=fw.filter(w=>ing.includes(w));
    if(hits.length){ sc+=hits.length*3; why.push('Usa lo que tienen: '+hits.join(', ')); }
    if(x.g.includes('pescado')&&need.pescado){ sc+=2.2*need.pescado; why.unshift(`Suma pescado${g.fishWho?' para '+g.fishWho:''}: van ${fmt(g.pescado,0)} de ${g.gFish} esta semana`); }
    const legIn = x.g.includes('legumbre') || (fit==='alt' && x.alt.g.includes('legumbre'));
    if(legIn&&need.legumbre){ sc+=1.2*need.legumbre; why.unshift(`Suma legumbres${g.legWho?' para '+g.legWho:''}: van ${fmt(g.legumbre,0)} de ${g.gLeg} esta semana`); }
    if(mixed && fit==='ok' && !why.length && x.m.includes('ac')) why.push('Sirve igual para los dos');
    if(fv[x.id]){ sc+=1.2; if(!why.length) why.push('Está entre sus favoritas'); }
    if(liked.has(x.id)){ sc+=0.8; if(!why.length) why.push('La última vez les encantó'); }
    const inSeason=season.filter(s=>ing.includes(s)); if(inSeason.length){ sc+=0.6; if(!why.length) why.push('De estación: '+inSeason.slice(0,2).join(' y ')); }
    if(x.g.includes('verdura')&&need.verdura){ sc+=1.2; if(!why.length) why.push('Suma verduras a la semana'); }
    if(x.g.includes('fruta')&&need.fruta){ sc+=1; if(!why.length) why.push('Suma fruta a la semana'); }
    if(x.g.includes('integral')&&need.integral){ sc+=0.8; if(!why.length) why.push('Suma cereales integrales'); }
    if(recent.has(x.id)){ sc-=4; why.push('Ya la tienen hace poco'); }
    if(x.t<=20 && !why.length) why.push('Rápida: '+x.t+' minutos');
    return {x,sc,why:why[0]||'Balanceada y casera'};
  }).sort((a,b)=>b.sc-a.sc);
}
function buildWeekPlan(){
  const t=TODAY(), slots=[], hour=new Date().getHours();
  for(let i=0;i<7;i++){ const d=addDays(t,i);
    for(const meal of ['almuerzo','cena']){ if(i===0 && (meal==='almuerzo'?hour>=14:hour>=21)) continue; if(!entriesOf(d).some(e=>e.meal===meal)) slots.push({d,meal}); } }
  const g=weekGaps();
  let needFish=Math.max(0,g.gFish-g.planFish), needLeg=Math.max(0,g.gLeg-g.planLeg);
  const pool=suggest('ac',0,'',S.idea.seed,false,'ambos').map(s=>s.x), used=new Set(), plan=[];
  const pick = pred => { const r=pool.find(x=>!used.has(x.id)&&pred(x)); if(r) used.add(r.id); return r; };
  const hasLeg = x => x.g.includes('legumbre') || (fitFor(x,'ambos')==='alt' && x.alt.g.includes('legumbre'));
  slots.forEach((sl,idx)=>{
    let r=null;
    if(needFish && idx%3===1){ r=pick(x=>x.g.includes('pescado')); if(r){ needFish--; if(hasLeg(r)) needLeg--; } }
    else if(needLeg && idx%2===0){ r=pick(hasLeg); if(r) needLeg--; }
    if(!r){ const weekday=parse(sl.d).getDay()%6!==0, noFish=x=>!x.g.includes('pescado');
      r=pick(x=>noFish(x)&&(idx%2===0?fitFor(x,'ambos')==='ok':true)&&(!weekday||x.t<=45)) || pick(noFish) || pick(()=>true); }
    if(r) plan.push({...sl,r});
  });
  return plan;
}

function arc(cx,cy,r0,r1,a0,a1){
  const p=(r,a)=>[cx+r*Math.cos((a-90)*Math.PI/180), cy+r*Math.sin((a-90)*Math.PI/180)];
  const [x0,y0]=p(r1,a0),[x1,y1]=p(r1,a1),[x2,y2]=p(r0,a1),[x3,y3]=p(r0,a0), lg=a1-a0>180?1:0;
  return `M${x0.toFixed(2)} ${y0.toFixed(2)}A${r1} ${r1} 0 ${lg} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}L${x2.toFixed(2)} ${y2.toFixed(2)}A${r0} ${r0} 0 ${lg} 0 ${x3.toFixed(2)} ${y3.toFixed(2)}Z`;
}

function loveCard(date){
  const L=dayDoc(date).love||{}, n=names(), note=dayDoc(date).note||'';
  const pi=k=>`<div class="postit"><span class="to">De ${esc(n[k])} para ${esc(n[other(k)])}</span><textarea id="love-${k}" data-love="${k}" rows="3" placeholder="${k==='a'?'Te dejé tarta en la heladera…':'Hoy cocino yo…'}">${esc(L[k]||'')}</textarea></div>`;

/* ----- Semana (planner) ----- */
function viewWeek(){
  const t=TODAY();
  const head=`<div class="section-h" style="margin-top:0"><div class="seg">${[['semana','Semana'],['mes','Mes']].map(([v,l])=>`<button type="button" data-a="sem-mode" data-v="${v}" aria-pressed="${S.semMode===v}">${l}</button>`).join('')}</div>
    <div class="row"><button type="button" class="btn warm" data-a="go-plan">Armar la semana</button><button type="button" class="btn ghost" data-a="copy-week">Copiar semana anterior</button></div></div>`;
  if(S.semMode==='mes') return banners()+head+viewCal();
  const mon=S.weekOf, end=addDays(mon,6), dm=parse(mon), de=parse(end);
  let th='<th class="mh"></th>';
  for(let i=0;i<7;i++){ const d=addDays(mon,i), dd=parse(d), sc=d<=t?dayScore(d):null;
    th+=`<th class="${d===t?'today':''}"><div class="dh"><button type="button" class="linkbtn" style="color:var(--ink)" data-a="open-day" data-v="${d}"><span class="small muted">${WD[dd.getDay()].slice(0,3)}</span> <b class="tnum">${dd.getDate()}</b></button>${sc!=null?`<span class="badge ${band(sc)} tnum">${fmt(sc)}</span>`:''}</div></th>`; }
  let rows='';
  for(const m of MEALS){
    rows+=`<tr><th class="mh" scope="row">${m.id==='extras'?'Extras':m.l}</th>`;
    for(let i=0;i<7;i++){ const d=addDays(mon,i), es=entriesOf(d).filter(e=>e.meal===m.id);
      rows+=`<td class="${d===t?'today':''}">${es.map(e=>`<button type="button" class="pl${d>t?' fut':''}" style="--who:${whoVar(e.who||'ambos')}" data-a="edit-entry" data-v="${d}|${e.id}">${esc(e.text)}</button>`).join('')}<button type="button" class="plus" data-a="add-at" data-v="${d}|${m.id}" aria-label="Agregar ${m.l} el ${WD[parse(d).getDay()]}">+</button></td>`; }
    rows+='</tr>';
  }
  const lbl = dm.getMonth()===de.getMonth() ? `${dm.getDate()} al ${de.getDate()} de ${MO[de.getMonth()]}` : `${dm.getDate()} de ${MO[dm.getMonth()]} al ${de.getDate()} de ${MO[de.getMonth()]}`;
  return `${banners()}${head}
    <div class="calhead"><button type="button" class="iconbtn" data-a="wk" data-v="-7" aria-label="Semana anterior">‹</button><h2 style="font-size:20px">${lbl}</h2><button type="button" class="iconbtn" data-a="wk" data-v="7" aria-label="Semana siguiente">›</button></div>
    <div class="board-wrap"><table class="board"><thead><tr>${th}</tr></thead><tbody>${rows}</tbody></table></div>
    <p class="muted small" style="margin-top:10px">Tocá cualquier comida para editarla, cambiarla de día o borrarla. Con el <b>+</b> agregan en ese casillero. Lo punteado es lo planeado.</p>`;
}
function viewCal(){
  const [y,mo]=S.calMonth.split('-').map(Number), first=new Date(y,mo-1,1), start=addDays(ymd(first),-((first.getDay()+6)%7)), t=TODAY();
  let cells=['Lu','Ma','Mi','Ju','Vi','Sá','Do'].map(x=>`<div class="wdh">${x}</div>`).join('');
  for(let i=0;i<42;i++){
    const d=addDays(start,i), dd=parse(d), es=entriesOf(d), sc=d<=t?dayScore(d):null;
    if(i===35 && dd.getMonth()!==mo-1) break;
    cells+=`<button type="button" class="cell${dd.getMonth()!==mo-1?' out':''}${d===t?' today':''}" data-a="open-day" data-v="${d}"><span class="num tnum">${dd.getDate()}</span>
      ${d>t&&es.length?`<span class="badge plan">plan</span>`:sc!=null?`<span class="badge ${band(sc)} tnum">${fmt(sc)}</span>`:''}
      ${es.length?`<span class="cnt">${es.length} ${es.length===1?'registro':'registros'}</span>`:''}</button>`;
  }
  return `<div class="calhead"><button type="button" class="iconbtn" data-a="month" data-v="-1" aria-label="Mes anterior">‹</button><h2>${MO[mo-1][0].toUpperCase()+MO[mo-1].slice(1)} ${y}</h2><button type="button" class="iconbtn" data-a="month" data-v="1" aria-label="Mes siguiente">›</button></div>
    <div class="calgrid">${cells}</div>
    <p class="muted small" style="margin-top:12px">El número es el puntaje del día (0 a 10) según el plato de las Guías Alimentarias Argentinas: <span style="color:var(--ok);font-weight:700">7 o más</span> muy bien, <span style="color:var(--mid);font-weight:700">4,5 a 7</span> con margen, <span style="color:var(--low);font-weight:700">menos de 4,5</span> flojo.</p>`;
}

function dietBadge(x){
  if(!['a','b'].some(isVegP)) return '';
  const rd=recipeDiet(x);
  if(rd!=='omni') return `<span class="gt" style="--c:var(--g-verdura);color:var(--g-verdura);font-weight:700">${rd==='vegano'?'Vegana':'Veggie'}</span>`;
  if(x.alt) return `<span class="gt" style="--c:var(--g-verdura);color:var(--g-verdura);font-weight:700">Con versión veggie</span>`;
  return '';
}
function recipeCard(x,why,fv){

}

/* ----- Juego ----- */
function viewGame(){
  const n=names(), t=TODAY(), mon=monday(t), w=weekInfo(mon), R=retos(w), st=streaks(), L=achievements();
  const tot=(w.pts.a+w.pts.b)||1, lead = w.pts.a===w.pts.b ? null : (w.pts.a>w.pts.b?'a':'b');
  const bets=(settings().bets||{}), bet=bets[mon]||'';
  const hist=[]; for(let i=1;i<=6;i++){ const m=addDays(mon,-7*i), wi=weekInfo(m); if(wi.logged){ const win=wi.pts.a===wi.pts.b?null:(wi.pts.a>wi.pts.b?'a':'b'); hist.push({m,wi,win,bet:bets[m]||''}); } }
  const wins={a:hist.filter(h=>h.win==='a').length, b:hist.filter(h=>h.win==='b').length};
  const cookAll=rangeMetrics(addDays(t,-29),t,'ambos').cook;
  return `${banners()}
  <div class="card">

      <div class="side-p"><span class="nm" style="color:var(--pa)">${esc(n.a)}</span><span class="pts tnum" style="color:var(--pa)">${fmt(w.pts.a)}</span><span class="small muted">${w.daysP.a} días anotados</span></div>
      <span class="vs">vs</span>
      <div class="side-p r"><span class="nm" style="color:var(--pb)">${esc(n.b)}</span><span class="pts tnum" style="color:var(--pb)">${fmt(w.pts.b)}</span><span class="small muted">${w.daysP.b} días anotados</span></div>
    </div>
    <div class="tug" aria-hidden="true"><i style="width:${(w.pts.a+w.pts.b)?w.pts.a/tot*100:50}%;background:var(--pa)"></i><i style="flex:1;background:var(--pb)"></i></div>
    <p class="small" style="margin:8px 0 0">${lead?`Va ganando <b style="color:${whoVar(lead)}">${esc(n[lead])}</b> por ${fmt(Math.abs(w.pts.a-w.pts.b))} puntos.`:(w.pts.a?'¡Empate técnico!':'Todavía no hay puntos esta semana.')}</p>

  </div>
  <div class="stats3">
    <div class="stat"><div class="label">Racha anotando</div><div class="v tnum">${st.cur} ${st.cur===1?'día':'días'}</div><div class="small muted">Récord: ${st.best}</div></div>
    <div class="stat"><div class="label">Retos de la semana</div><div class="v tnum">${R.filter(r=>r.done).length}/${R.length}</div><div class="small muted">Se reinician el lunes</div></div>
    <div class="stat"><div class="label">Quién cocinó (30 días)</div><div class="v tnum" style="font-size:22px"><span style="color:var(--pa)">${cookAll.a}</span> · <span style="color:var(--pb)">${cookAll.b}</span> · <span style="color:var(--accent)">${cookAll.juntos}</span></div><div class="small muted">${esc(n.a)} · ${esc(n.b)} · juntos</div></div>
    <div class="stat"><div class="label">Semanas ganadas</div><div class="v tnum" style="font-size:22px"><span style="color:var(--pa)">${wins.a}</span> a <span style="color:var(--pb)">${wins.b}</span></div><div class="small muted">Últimas 6 semanas</div></div>
  </div>
  <div class="section-h"><h2>Retos de la semana</h2></div>
  <div class="retos">${R.map(r=>`<div class="reto${r.done?' done':''}"><div class="t"><b>${r.n}</b><span style="color:var(--${r.done?'ok':'ink-2'})">${r.done?'✓ Cumplido':`${Math.min(r.v,r.g)}/${r.g}`}</span></div><div class="small muted">${r.d}${r.note?` · ${esc(r.note)}`:''}</div><div class="bar"><i style="width:${Math.min(100,r.v/r.g*100)}%"></i></div>${!r.done&&RETO_IDEAS[r.id]?`<button type="button" class="linkbtn" data-a="reto-ideas" data-v="${r.id}">${RETO_IDEAS[r.id].l} ›</button>`:''}

/* ----- Reporte ----- */
function viewRep(){
  const R=S.rep, to=TODAY(), from=addDays(to,-(R.range-1)), n=names(), m=rangeMetrics(from,to,R.who), wk=R.range/7;
  const v=m.scores.filter(s=>s.s!=null), avg=v.length? v.reduce((a,s)=>a+s.s,0)/v.length : null, pd=x=>m.days?x/m.days:0;
  const metric=(label,val,goal,unit,opts={})=>{
    const lower=opts.lower, max=opts.max||goal*1.6||1, pct=Math.min(100,val/max*100), gp=Math.min(100,goal/max*100);
    const st = lower ? (val<=goal?'ok':val<=goal*2?'mid':'low') : (val>=goal?'ok':val>=goal*0.6?'mid':'low');
    const stl = lower ? (st==='ok'?'✓ Bajo control':st==='mid'?'Un poco alto':'Alto') : (st==='ok'?'✓ En meta':st==='mid'?'Cerca':'Falta');
    return `<div class="metric"><div class="top2"><span style="font-weight:600">${label}</span><span class="st ${st}">${stl}</span></div>
      <div class="top2"><span class="v tnum">${fmt(val)}</span><span class="goal">${lower?'máx.':'meta'} ${fmt(goal)} ${unit}</span></div>
      <div class="meter" style="--c:var(--${st})"><i style="width:${pct}%"></i><b style="left:${gp}%"></b></div></div>`;
  };
  const tops=Object.values(m.texts).sort((a,b)=>b.n-a.n).slice(0,5);
  const fishLeg=fishLegFor(R.who,from,to,m);
  const mg=m.mood.good, mr=m.mood.rest, avgArr=a=>a.reduce((x,y)=>x+y,0)/a.length;
  const moodInsight = mg.length>=2&&mr.length>=2 ? `Los días con buen puntaje su energía promedio fue <b>${fmt(avgArr(mg))}</b> de 5, y el resto <b>${fmt(avgArr(mr))}</b>.` : '';
  return `${banners()}
  <div class="rephead"><h2 style="font-size:26px;font-weight:800">Cómo venimos</h2>
    <div class="row"><div class="seg">${[[7,'7 días'],[14,'14 días'],[30,'30 días']].map(([v,l])=>`<button type="button" data-a="r-range" data-v="${v}" aria-pressed="${R.range===v}">${l}</button>`).join('')}</div>${whoSeg('r-who',R.who)}</div></div>

/* Pescado se mide para quien come carne y legumbres (meta 4) para quien es veggie */
function fishLegFor(who,from,to,m){
  const n=names(), omni=['a','b'].filter(p=>!isVegP(p)), veg=['a','b'].filter(isVegP), mixed=omni.length===1&&veg.length===1;
  if(who==='ambos'&&mixed){ const mo=rangeMetrics(from,to,omni[0]), mv=rangeMetrics(from,to,veg[0]);
    return {fish:true, fishV:mo.cnt.pescado, fishLbl:' · '+n[omni[0]], legV:mv.cnt.legumbre, legG:4, legLbl:' · '+n[veg[0]]}; }
  const G=goalsFor(who);
  return {fish:G.pescado>0, fishV:m.cnt.pescado, fishLbl:'', legV:m.cnt.legumbre, legG:G.legumbre, legLbl:''};
}
function recipeLink(tag){ const r=suggest('ac',0,'',S.idea.seed).map(s=>s.x).find(x=>x.g.includes(tag)); return r?` Probá <button type="button" class="linkbtn" data-a="recipe" data-v="${esc(r.id)}">${esc(r.n)}</button>.`:''; }
function buildTips(m,wk){
  if(!m.days) return ['Todavía no hay nada anotado en este período. Empiecen por hoy: con anotar las comidas principales alcanza.'];
  const t=[], pd=x=>x/m.days;
  const R=S.rep, FL=fishLegFor(R.who, addDays(TODAY(),-(R.range-1)), TODAY(), m);
  if(FL.fish && FL.fishV/wk<2) t.push('<b>Pescado'+FL.fishLbl+':</b> van '+fmt(FL.fishV/wk)+' veces por semana y la meta es 2. La merluza y la caballa en lata son lo más barato.'+recipeLink('pescado'));
  if(FL.legV/wk<FL.legG) t.push('<b>Legumbres'+FL.legLbl+':</b> van '+fmt(FL.legV/wk)+' por semana, meta '+FL.legG+'. '+(FL.legG>2?'Para quien es veggie son la base de la proteína: lentejas, garbanzos, porotos, tofu.':'Sumen lentejas o garbanzos.')+' En lata ya vienen cocidas y se hacen en 10 minutos.'+recipeLink('legumbre'));
  if(['a','b'].some(p=>isVegP(p)&&(R.who==='ambos'||R.who===p))) t.push('<b>Hierro veggie:</b> acompañen lentejas y espinaca con limón, morrón o naranja, y dejen el mate para un rato después. Un chequeo anual de hierro y B12 viene bien.');
  if(pd(m.fv)<5) t.push('<b>Frutas y verduras:</b> vienen con '+fmt(pd(m.fv))+' porciones por día. Lo más fácil: medio plato de verduras en almuerzo y cena, y una fruta de postre.');
  if(pd(m.water)<8) t.push('<b>Agua:</b> '+fmt(pd(m.water))+' vasos por día en promedio. Dejen una jarra a la vista. El mate suma, pero no reemplaza el agua.');
  if(m.cnt.gaseosa/wk>1) t.push('<b>Bebidas azucaradas:</b> cambien la gaseosa por soda o agua con limón, menta o jengibre.');
  if((m.cnt.ultra+m.cnt.dulce)/wk>3) t.push('<b>Ultraprocesados y dulces:</b> preparen algo casero para la merienda. Probá <button type="button" class="linkbtn" data-a="recipe" data-v="budin-banana">el budín de banana y avena</button>.');
  if(m.cnt.alcohol/wk>3) t.push('<b>Alcohol:</b> apareció '+fmt(m.cnt.alcohol/wk)+' veces por semana. Prueben dejarlo para el finde.');
  if(m.dayHas.integral/m.days<0.6) t.push('<b>Integrales:</b> la avena en el desayuno es la forma más fácil. Probá <button type="button" class="linkbtn" data-a="recipe" data-v="overnight">la avena de la noche</button>.');
  if(m.cnt.afuera/wk>2) t.push('<b>Comidas afuera:</b> '+fmt(m.cnt.afuera/wk)+' por semana. Armen la semana el domingo: con el plan resuelto se pide menos delivery.');
  if(!t.length) t.push('<b>¡Vienen bárbaro!</b> Están en todas las metas. Sigan variando colores y prueben una receta nueva.');
  return t.slice(0,5);
}
function chartSvg(scores,range){
  const W=380,H=160,L=22,B=22,T=8,Rr=4, iw=W-L-Rr, ih=H-T-B, bw=iw/scores.length, y=v=>T+ih-(v/10)*ih;
  let g='';
  [0,5,10].forEach(v=>{ g+=`<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--ink-2)">${v}</text>`; });
  const bar=(x,w,v,col)=>{ const top=y(v), h=T+ih-top; if(h<1) return `<rect x="${x}" y="${T+ih-2}" width="${w}" height="2" fill="${col}"/>`; const r=Math.min(3,w/2,h); return `<path d="M${x} ${T+ih}V${top+r}q0 -${r} ${r} -${r}h${w-2*r}q${r} 0 ${r} ${r}V${T+ih}Z" fill="${col}"/>`; };
  scores.forEach((s,i)=>{
    const x=L+i*bw, gw=Math.max(2,Math.min(26,bw-3)), cx=x+bw/2, half=(gw-1)/2, dd=parse(s.d);
    if(s.a!=null) g+=bar(cx-half-0.5,half,s.a,'var(--pa)');
    if(s.b!=null) g+=bar(cx+0.5,half,s.b,'var(--pb)');
    if(s.a==null&&s.b==null) g+=`<circle cx="${cx}" cy="${T+ih-4}" r="1.6" fill="var(--line)"/>`;
    const lab = range<=7 ? WD[dd.getDay()].slice(0,2) : (i%5===0||i===scores.length-1? dd.getDate():'');
    if(lab!=='') g+=`<text x="${cx}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--ink-2)">${lab}</text>`;
    const n=names(); g+=`<rect x="${x}" y="${T}" width="${bw}" height="${ih}" fill="transparent" data-tip="${WD[dd.getDay()]} ${dd.getDate()} · ${esc(n.a)}: ${s.a==null?'–':fmt(s.a)} · ${esc(n.b)}: ${s.b==null?'–':fmt(s.b)}"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Puntaje diario de cada uno, de 0 a 10">${g}</svg>`;
}
function wireChart(){
  const c=document.getElementById('chart'); if(!c) return; let tip=null;
  const show=e=>{ const r=e.target.closest&&e.target.closest('rect[data-tip]'); if(!r){ if(tip){tip.remove();tip=null;} return; }
    if(!tip){ tip=document.createElement('div'); tip.className='tip'; c.appendChild(tip); }
    tip.textContent=r.dataset.tip; const b=c.getBoundingClientRect(), bb=r.getBoundingClientRect(); tip.style.left=Math.max(70,Math.min(b.width-70,bb.left-b.left+bb.width/2))+'px'; tip.style.top=(bb.top-b.top+10)+'px'; };
  c.addEventListener('mousemove',show); c.addEventListener('click',show);
  c.addEventListener('mouseleave',()=>{ if(tip){tip.remove();tip=null;} });
}

const WHEEL_COLS=['--g-verdura','--g-fruta','--g-legumbre','--g-lacteo','--g-pescado','--warm','--g-integral','--c-violeta'];
function wheelHtml(W){
  const n=W.items.length, seg=360/n;
  let g='';
  W.items.forEach((x,i)=>{
    const a0=i*seg, a1=(i+1)*seg, mid=a0+seg/2;
    g+=`<path d="${arc(150,150,0.01,146,a0,a1)}" fill="var(${WHEEL_COLS[i%WHEEL_COLS.length]})" stroke="var(--surface)" stroke-width="2"/>`;
    const lbl=x.n.length>24?x.n.slice(0,23)+'…':x.n;

  return `<h2>La ruleta de ${esc(CATS.find(c=>c.id===W.cat).l.toLowerCase())}</h2><p class="muted small" style="margin:0">8 opciones que le suman a la semana. Gira y se cumple.</p>

/* ================= Confetti ================= */
function confetti(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c=document.getElementById('confetti'); c.hidden=false; c.width=innerWidth; c.height=innerHeight;
  const x=c.getContext('2d'), cs=getComputedStyle(document.documentElement);
  const cols=['--c-rosa','--rb-amarillo','--g-verdura','--pa','--pb','--warm','--g-lacteo'].map(v=>cs.getPropertyValue(v).trim()||'#e44');
  const P=Array.from({length:140},()=>({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*0.35,vx:(Math.random()-.5)*14,vy:-Math.random()*13-4,s:5+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.floor(Math.random()*cols.length)],h:Math.random()<.25}));
  let f=0;
  (function tick(){ x.clearRect(0,0,c.width,c.height);
    P.forEach(p=>{ p.vy+=.35; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c;
      if(p.h){ x.font=(p.s*2.4)+'px sans-serif'; x.fillText('♥',-p.s,p.s); } else x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); x.restore(); });
    if(++f<110) requestAnimationFrame(tick); else { x.clearRect(0,0,c.width,c.height); c.hidden=true; } })();
}

function toast(t, undo){
  const b=document.getElementById('toastbox'); b.innerHTML=`<div class="toast" role="status"><span>${esc(t)}</span>${undo?'<button type="button" id="undo">Deshacer</button>':''}</div>`;
  if(undo) document.getElementById('undo').onclick=()=>{ undo(); b.innerHTML=''; };
  clearTimeout(toast.t); toast.t=setTimeout(()=>b.innerHTML='',undo?5000:3200);
}

function recipeBodies(r, who, meal){
  const base={meal,cook:'',recipeId:r.id};
  if(who==='ambos' && fitFor(r,'ambos')==='alt'){
    const omni=['a','b'].filter(p=>!isVegP(p)), veg=['a','b'].filter(isVegP);
    return [...omni.map(p=>({...base,who:p,text:r.n,tags:r.g.slice()})), ...veg.map(p=>({...base,who:p,text:r.alt.n,tags:r.alt.g.slice(),alt:true}))];
  }
  return [{...base,who,text:r.n,tags:r.g.slice()}];
}

      const res={n:String(j.nombre||'Receta'),t:Math.max(1,parseInt(j.minutos)||30),why:String(j.porque||'')+(vg?' Versión veggie: '+vg:''),
        i:(Array.isArray(j.ingredientes)?j.ingredientes:[]).map(String).slice(0,25),s:(Array.isArray(j.pasos)?j.pasos:[]).map(String).slice(0,20),
        g:(Array.isArray(j.grupos)?j.grupos:[]).filter(x=>TAG[x]&&!['ultra','dulce','gaseosa','alcohol','afuera'].includes(x))};
      if(!res.i.length||!res.s.length) throw {code:'bad'};
      A.result=res;
    }catch(e){
      const c=e&&e.code;
      A.err = c==='not_granted'?'Hace falta permitir que la página consulte a Claude.':c==='rate_limited'?'Muchos pedidos seguidos. Esperá un minuto.':c==='cancelled'?'':'No salió una receta válida. Probá de nuevo.';
      if(c==='not_granted') sample=null;
    }
    A.busy=false; render();
  },
  'ai-save':()=>{ const r=S.ai.result; if(!r) return; const id=uid(); setDoc('recipes/'+id,{n:r.n,t:r.t,m:[S.idea.cat],i:r.i,s:r.s,g:r.g,tip:r.why}); S.ai.result=null; toast('Guardada en Nuestras recetas.'); S.sheet={type:'recipe',id}; render(); },
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]'); if(!el) return;
  if(el.type==='checkbox') e.preventDefault();
  const fn=ACT[el.dataset.a]; if(fn) fn(el.dataset.v, e);
});
function liveTags(f, text, chipsSel, whoAct, hintId){
  f.text=text; const auto=autoTags(text);
  TAGS.forEach(t=>{ if(f.touched.has(t.id)) return; auto.has(t.id)?f.tags.add(t.id):f.tags.delete(t.id); });
  document.querySelectorAll(chipsSel+' [aria-pressed]').forEach(b=>b.setAttribute('aria-pressed',String(f.tags.has(b.dataset.v))));
  // Si tiene carne y una persona es veggie, se anota para quien come carne
  const omni=['a','b'].filter(p=>!isVegP(p)), hint=document.getElementById(hintId);
  if(!f.whoTouched && omni.length===1){
    const meat=hasMeat(text); const want = meat ? omni[0] : (f.autoWho ? 'ambos' : f.who);
    if(want!==f.who){ f.who=want; f.autoWho=meat; setPressed(whoAct,want); }
    if(hint) hint.textContent = meat ? `Lo anoto para ${names()[omni[0]]}: ${vegName()} es veggie.` : '';
  }
}
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='f-text' && S.form) liveTags(S.form, e.target.value, '#f-chips', 'f-who', 'f-hint');
  if(id==='ef-text' && S.ef) liveTags(S.ef, e.target.value, '#ef-chips', 'ef-who', 'ef-hint');
  if(id==='fridge'){ clearTimeout(ACT._ft); ACT._ft=setTimeout(()=>{ S.idea.fridge=e.target.value; const pos=e.target.selectionStart; render(); const f=document.getElementById('fridge'); if(f){ f.focus(); f.setSelectionRange(pos,pos);} },500); }
  if(id==='ai-in') S.ai.text=e.target.value;
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter' && e.target.id==='f-text'){ e.preventDefault(); ACT['save-entry'](); }
  if(e.key==='Enter' && e.target.id==='ef-text'){ e.preventDefault(); ACT['ef-save'](); }
  if(e.key==='Enter' && e.target.id==='shop-in'){ e.preventDefault(); ACT['shop-add'](); }
  if(e.key==='Enter' && e.target.id==='bet-in'){ e.preventDefault(); ACT['bet-save'](); }
  if(e.key==='Escape'){ if(S.sheet){ S.sheet=null; S.ef=null; renderSheet(); } else if(S.form){ S.form=null; render(); } }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='note'){ if(t.value!==(dayDoc(S.sel).note||'')) patchDoc('days/'+S.sel,{note:t.value}); }
  if(t.dataset && t.dataset.love){ const k=t.dataset.love; if(t.value!==((dayDoc(S.sel).love||{})[k]||'')) patchDoc('days/'+S.sel,{love:{[k]:t.value}}); }
});

render();
initStore();
</script>
